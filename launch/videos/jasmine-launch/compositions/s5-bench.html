  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const A = [87, 174, 192, 3346], AMAX = 200;      // create → first command, ms
      const B = [4.1, 37, 28, 34], BMAX = 40;          // run a command, ms
      const st = { m: 0 };
      const rows = [0, 1, 2, 3].map((i) => {
        const r = document.getElementById("s5-r" + i);
        return { bar: r.querySelector(".s5-bar"), val: r.querySelector(".s5-v"), o: { v: 0 } };
      });
      const fmt = (v, dec) => (dec ? v.toFixed(1) : Math.round(v).toLocaleString("en-US")) + " ms";
      const place = (row, scale, v, dec, broken) => {
        gsap.set(row.bar, { scaleX: Math.min(scale, 1) });
        row.val.textContent = fmt(v, dec) + (broken ? "  ⟶" : "");
        gsap.set(row.val, { x: Math.min(scale, 1) * 1100 + 22 });
      };
      tl.fromTo(["#s5-t", "#s5-k"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.06, ease: "expo.out" }, 0);
      JX.scramble(tl, "#s5-m", "create → first command", 0.45, 0.4);
      rows.forEach((row, i) => {
        place(row, 0, 0, false, false);
        const o = row.o;
        tl.fromTo(o, { v: 0 }, { v: 1, duration: 0.7, ease: "expo.out", immediateRender: false,
          onUpdate: () => place(row, (A[i] / AMAX) * o.v, A[i] * o.v, false, i === 3 && o.v > 0.06) }, 0.7 + i * 0.12);
      });
      tl.to("#s5-r3 .s5-bar", { opacity: 0.55, duration: 0.3 }, 1.5);
      // Morph to the second metric.
      JX.scramble(tl, "#s5-m", "run a command", 3.5, 0.35);
      rows.forEach((row, i) => {
        const o = { u: 0 };

          onUpdate: () => {
            const sA = Math.min(A[i] / AMAX, 1), sB = B[i] / BMAX;
            place(row, sA + (sB - sA) * o.u, A[i] + (B[i] - A[i]) * o.u, o.u > 0.5, i === 3 && o.u < 0.5);
          } }, 3.55 + i * 0.05);
      });
      tl.to("#s5-r3 .s5-bar", { opacity: 1, duration: 0.3 }, 3.6);

      tl.to(["#s5-t","#s5-k","#s5-m","#s5-r0","#s5-r1","#s5-r2","#s5-r3","#s5-f"], { opacity: 0, y: -20, duration: 0.25, stagger: 0.015, ease: "power3.in" }, 7.65);
      window.__timelines["s5"] = tl;
    })();
