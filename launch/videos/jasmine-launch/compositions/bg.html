<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #bg-c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; image-rendering: pixelated; }
  </style>
  <div id="root" data-composition-id="bg" data-width="1920" data-height="1080">
    <canvas id="bg-c" width="480" height="270"></canvas>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const c = document.getElementById("bg-c");
      const g = c.getContext("2d");
      const W = 480, H = 270;
      const img = g.createImageData(W, H);
      const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
      const ground = [7, 8, 7], leaf = [166, 232, 107], bud = [240, 183, 204];
      // Scored flood amount (0 = calm texture, 1 = frame full of dither) at film time t.
      const keys = [[0, 0.05], [6.9, 0.08], [7.95, 1.0], [8.0, 1.0], [8.9, 0.04], [12, 0.0], [36.4, 0.0], [37.9, 0.85], [38.0, 0.9], [38.7, 0.06], [42, 0.03], [44, 0.0]];
      const flood = (t) => {
        for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
          const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
          const u = (t - t0) / Math.max(1e-6, t1 - t0);
          return v0 + (v1 - v0) * (u * u * (3 - 2 * u));
        }
        return 0;
      };
      const draw = (t) => {
        const f = flood(t);
        const d = img.data;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const nx = x / W, ny = y / H;
            // Two slow diagonal bands, like a gradients.sh grain field.
            let v = 0.5 + 0.5 * Math.sin((nx * 3.1 - ny * 2.2) * Math.PI + t * 0.35 + Math.sin(ny * 4.0 + t * 0.21) * 1.3);
            v = v * v * 0.42 * (1 - ny * 0.35) + f * (0.25 + 0.55 * v);
            const lit = v > B[(y & 3) * 4 + (x & 3)];
            const m = 0.5 + 0.5 * Math.sin(nx * 5.0 + ny * 3.0 - t * 0.27);
            const k = m > 0.86 ? 1 : 0; const col = lit ? (k ? bud : leaf) : ground;
            const a = lit ? 0.32 + 0.6 * f : 1;
            const i = (y * W + x) * 4;
            d[i] = ground[0] + (col[0] - ground[0]) * a;
            d[i + 1] = ground[1] + (col[1] - ground[1]) * a;
            d[i + 2] = ground[2] + (col[2] - ground[2]) * a;
            d[i + 3] = 255;
          }
        }
        g.putImageData(img, 0, 0);
      };
      const clock = { t: 0 };
      draw(0);
      tl.fromTo(clock, { t: 0 }, { t: 44, duration: 44, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["bg"] = tl;
    })();
  </script>
</template>
