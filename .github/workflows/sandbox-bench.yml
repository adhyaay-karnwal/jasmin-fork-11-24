name: sandbox-bench
# Runs Jasmine through aisandboxbench.com's own open-source harness
# (opencoredev/sandbox-sdk, pinned), over the public internet via a Cloudflare
# quick tunnel, so Jasmine gets no localhost advantage over hosted providers.
on:
  push:
    paths: ["integrations/sandbox-sdk/jasmine/**", "integrations/sandbox-sdk/apply.py", ".github/workflows/sandbox-bench.yml"]
  workflow_dispatch:
    inputs:
      runs: { description: "iterations per scenario (published runs use 100)", default: "100" }
      scenarios: { description: "scenario list or all", default: "all" }
      track: { description: "same-spec or default", default: "same-spec" }
      suites: { description: "main,snapshot,burst", default: "main,snapshot,burst" }

env:
  HARNESS_REPO: https://github.com/opencoredev/sandbox-sdk
  HARNESS_REF: b23a99b

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Host info
        run: nproc; free -h; grep -m1 'model name' /proc/cpuinfo; ls -l /dev/kvm; df -h / /mnt; lsblk -d -o NAME,SIZE,ROTA,MODEL
      - name: Build Jasmine
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build -q --release -p jasmine-agent --target x86_64-unknown-linux-musl
          cargo build -q --release -p jasmined
      - name: Set up host
        run: |
          sudo JASMINE_XFS_SIZE=60G JASMINE_XFS_IMG=$( [ -d /mnt ] && echo /mnt/jasmine-xfs.img || echo /var/jasmine-xfs.img ) dev/setup-host.sh
          sudo install -D -m 0755 target/x86_64-unknown-linux-musl/release/jasmine-agent /usr/local/lib/jasmine/jasmine-agent
          sudo install -m 0755 target/release/jasmined /usr/local/bin/jasmined
      - name: Build templates (node:22-bookworm has node, npm, git, curl, python3.11)
        run: |
          time sudo jasmined build bench node:22-bookworm --vcpus 2 --mem-mib 4096
          time sudo jasmined build bench-4x8192 node:22-bookworm --vcpus 4 --mem-mib 8192
      - name: Start jasmined behind a public tunnel
        run: |
          KEY=$(openssl rand -hex 24); echo "::add-mask::$KEY"; echo "JASMINE_API_KEY=$KEY" >> $GITHUB_ENV
          sudo JASMINE_API_KEY=$KEY JASMINE_NET_POOL=48 bash -c 'nohup jasmined serve > /tmp/jasmined.log 2>&1 &'
          for i in $(seq 100); do curl -fs localhost:7171/healthz && break; sleep 0.2; done
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /tmp/cloudflared
          # Quick tunnels sometimes take a while to become reachable; insist on it, retrying with a new tunnel.
          for attempt in 1 2 3; do
            pkill cloudflared || true; : > /tmp/tunnel.log
            nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:7171 > /tmp/tunnel.log 2>&1 &
            U=""; for i in $(seq 60); do U=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1); [ -n "$U" ] && break; sleep 1; done
            ok=0; for i in $(seq 90); do curl -fs "$U/healthz" >/dev/null && ok=$((ok+1)) || ok=0; [ $ok -ge 5 ] && break; sleep 1; done
            [ $ok -ge 5 ] && break; echo "tunnel attempt $attempt not reachable"; U=""
          done
          [ -n "$U" ] || { echo "no reachable tunnel"; exit 1; }
          echo "JASMINE_URL=$U" >> $GITHUB_ENV
          echo "tunnel: $U"
          for i in $(seq 10); do curl -s -o /dev/null -w '%{time_total}\n' "$U/healthz"; done | sort -n | awk '{a[NR]=$1} END {print "tunnel RTT p50 (s):", a[int(NR/2)+1]}'
      - uses: oven-sh/setup-bun@v2
      - name: Fetch harness and apply the Jasmine adapter
        run: |
          git clone -q "$HARNESS_REPO" /tmp/harness && git -C /tmp/harness checkout -q "$HARNESS_REF"
          python3 integrations/sandbox-sdk/apply.py /tmp/harness
          cd /tmp/harness && bun install --frozen-lockfile 2>&1 | tail -2
          bun run --cwd packages/sdk build 2>&1 | tail -3
          bun run --cwd packages/sdk typecheck
          bun run --cwd bench typecheck
      - name: Run the harness (Jasmine)
        run: |
          set -o pipefail
          cd /tmp/harness/bench
          # Same call path the harness uses, as a smoke test with the real error visible.
          bun -e 'const {jasmine}=await import("@opencoredev/sandbox-sdk/jasmine"); const p=jasmine({template:"bench"}); const s=await p.create({labels:{smoke:"1"}}); console.log("smoke create", s.id); await p.destroy(s.id);'
          # Mirrors the harness's own collection plan (bench/src/collection-plan.sh):
          # main, snapshot and burst suites as separate invocations with its flags.
          RUNS="${{ inputs.runs || '100' }}"; WRUNS=$(( RUNS < 30 ? RUNS : 30 ))
          COMMON=(--providers jasmine --track "${{ inputs.track || 'same-spec' }}" --size jasmine=4:8192 --template jasmine=bench
                  --account-limits jasmine=200 --omit-network-download true --seed 45 --max-dollars 25)
          MAIN=command,files-1kb,files-10mb,reconnect,pause-resume,perf,git-clone,npm-install,dev-server,preview-first-byte,edit-loop,tool-replay,pip-install
          rc=0
          SUITES="${{ inputs.suites || 'main,snapshot,burst' }}"
          [[ ,$SUITES, == *,main,* ]] && { bun src/cli.ts "${COMMON[@]}" --concurrency 4 --provider-concurrency 1 --runs "$RUNS" --workload-runs "$WRUNS" \
            --scenarios "$MAIN" --bursts '' --timeout-ms 180000 --max-sandboxes 1000 --run jasmine-main --out /tmp/results/main 2>&1 | grep -vE "sample [0-9.]+ms$" | tail -15 || rc=1; }
          [[ ,$SUITES, == *,snapshot,* ]] && { bun src/cli.ts "${COMMON[@]}" --concurrency 4 --provider-concurrency 1 --runs $(( RUNS < 30 ? RUNS : 30 )) \
            --scenarios snapshot --bursts '' --timeout-ms 600000 --max-sandboxes 1000 --run jasmine-snapshot --out /tmp/results/snapshot 2>&1 | grep -vE "sample [0-9.]+ms$" | tail -15 || rc=1; }
          [[ ,$SUITES, == *,burst,* ]] && { bun src/cli.ts "${COMMON[@]}" --runs 1 --scenarios burst --bursts 10,25 --burst-cohorts 3 --concurrency 25 \
            --timeout-ms 180000 --max-sandboxes 1000 --run jasmine-burst --out /tmp/results/burst 2>&1 | grep -vE "sample [0-9.]+ms$" | tail -15 || rc=1; }
          exit $rc
      - name: Report
        if: always()
        run: |
          for f in /tmp/results/*/results.md; do echo "== $f"; head -80 "$f"; done 2>/dev/null || true
          echo "== jasmined errors"; sudo grep -E "WARN|ERROR" /tmp/jasmined.log | tail -20
          echo "== host kernel (oom / kvm)"; sudo dmesg | grep -iE "oom|killed process|kvm" | tail -20
          echo "== memory"; free -h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-bench-results
          path: /tmp/results
          if-no-files-found: ignore
