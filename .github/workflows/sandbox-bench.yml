name: sandbox-bench
# Runs Warren through aisandboxbench.com's own open-source harness
# (opencoredev/sandbox-sdk, pinned), over the public internet via a Cloudflare
# quick tunnel, so Warren gets no localhost advantage over hosted providers.
on:
  push:
    paths: ["integrations/**", ".github/workflows/sandbox-bench.yml", "crates/**"]
  workflow_dispatch:
    inputs:
      runs: { description: "iterations per scenario", default: "10" }
      scenarios: { description: "scenario list or all", default: "all" }
      track: { description: "same-spec or default", default: "same-spec" }

env:
  HARNESS_REPO: https://github.com/opencoredev/sandbox-sdk
  HARNESS_REF: b23a99b

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Host info
        run: nproc; free -h; grep -m1 'model name' /proc/cpuinfo; ls -l /dev/kvm
      - name: Build Warren
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build -q --release -p warren-agent --target x86_64-unknown-linux-musl
          cargo build -q --release -p warrend
      - name: Set up host
        run: |
          sudo WARREN_XFS_SIZE=60G dev/setup-host.sh
          sudo install -D -m 0755 target/x86_64-unknown-linux-musl/release/warren-agent /usr/local/lib/warren/warren-agent
          sudo install -m 0755 target/release/warrend /usr/local/bin/warrend
      - name: Build templates (node:22-bookworm has node, npm, git, curl, python3.11)
        run: |
          time sudo warrend build bench node:22-bookworm --vcpus 2 --mem-mib 4096
          time sudo warrend build bench-4x8192 node:22-bookworm --vcpus 4 --mem-mib 8192
      - name: Start warrend behind a public tunnel
        run: |
          KEY=$(openssl rand -hex 24); echo "::add-mask::$KEY"; echo "WARREN_API_KEY=$KEY" >> $GITHUB_ENV
          sudo WARREN_API_KEY=$KEY WARREN_NET_POOL=48 bash -c 'nohup warrend serve > /tmp/warrend.log 2>&1 &'
          for i in $(seq 100); do curl -fs localhost:7171/healthz && break; sleep 0.2; done
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:7171 > /tmp/tunnel.log 2>&1 &
          for i in $(seq 60); do U=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1); [ -n "$U" ] && break; sleep 1; done
          echo "WARREN_URL=$U" >> $GITHUB_ENV
          for i in $(seq 60); do curl -fs "$U/healthz" && break; sleep 1; done; echo
          echo "tunnel: $U"
          for i in $(seq 10); do curl -s -o /dev/null -w '%{time_total}\n' "$U/healthz"; done | sort -n | awk '{a[NR]=$1} END {print "tunnel RTT p50 (s):", a[int(NR/2)+1]}'
      - uses: oven-sh/setup-bun@v2
      - name: Fetch harness and apply the Warren adapter
        run: |
          git clone -q "$HARNESS_REPO" /tmp/harness && git -C /tmp/harness checkout -q "$HARNESS_REF"
          python3 integrations/sandbox-sdk/apply.py /tmp/harness
          cd /tmp/harness && bun install --frozen-lockfile 2>&1 | tail -2
          bun run --cwd packages/sdk build 2>&1 | tail -3
          bun run --cwd packages/sdk typecheck
          bun run --cwd bench typecheck
      - name: Run the harness (Warren)
        run: |
          cd /tmp/harness/bench
          bun src/cli.ts --providers warren \
            --track "${{ inputs.track || 'same-spec' }}" \
            --size warren=4:8192 --template warren=bench \
            --runs "${{ inputs.runs || '10' }}" --scenarios "${{ inputs.scenarios || 'all' }}" \
            --bursts 10,25 --account-limits warren=30 --max-dollars 1000 \
            --run warren-ci --out /tmp/results/warren 2>&1 | tail -80
      - name: Report
        if: always()
        run: |
          cat /tmp/results/warren/results.md 2>/dev/null | head -150 || true
          echo "== warrend log"; sudo tail -40 /tmp/warrend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-bench-results
          path: /tmp/results
          if-no-files-found: ignore
