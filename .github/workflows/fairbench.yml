name: fairbench
# Same-host, interleaved, held-out benchmark: Warren vs Docker (runc), gVisor and Kata.
on:
  push:
    paths: ["bench/fair/**", ".github/workflows/fairbench.yml"]
  workflow_dispatch:
    inputs:
      rounds: { description: "interleaved rounds", default: "15" }
      heavy_rounds: { description: "rounds that include the heavy tasks", default: "5" }
      systems: { description: "systems", default: "warren,docker,gvisor,kata" }
      warren_ref: { description: "git ref of Warren to build (A/B runs)", default: "" }

jobs:
  fairbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host info
        run: nproc; free -h; grep -m1 'model name' /proc/cpuinfo; uname -r; ls -l /dev/kvm; df -h / /mnt
      - name: Build Warren
        run: |
          [ -n "${{ inputs.warren_ref }}" ] && git fetch -q origin "${{ inputs.warren_ref }}" && git checkout -q FETCH_HEAD -- crates
          rustup target add x86_64-unknown-linux-musl
          cargo build -q --release -p warren-agent --target x86_64-unknown-linux-musl
          cargo build -q --release -p warrend
      - name: Install gVisor and Kata as Docker runtimes
        run: |
          set -x
          ARCH=$(uname -m)
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}
          ( cd /tmp && curl -fsSLO $URL/runsc && curl -fsSLO $URL/containerd-shim-runsc-v1 && chmod +x runsc containerd-shim-runsc-v1 && sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin/ ) || echo "gvisor download failed"
          KV=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/kata-containers/kata-containers/releases/latest | xargs basename)
          ( curl -fsSL "https://github.com/kata-containers/kata-containers/releases/download/${KV}/kata-static-${KV}-amd64.tar.zst" -o /tmp/kata.tar.zst \
            && sudo tar --zstd -xf /tmp/kata.tar.zst -C / \
            && sudo ln -sf /opt/kata/bin/containerd-shim-kata-v2 /usr/local/bin/containerd-shim-kata-v2 \
            && sudo ln -sf /opt/kata/bin/kata-runtime /usr/local/bin/kata-runtime ) || echo "kata download failed"
          echo '{"runtimes":{"runsc":{"path":"/usr/local/bin/runsc"},"kata":{"runtimeType":"io.containerd.kata.v2"}}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
          sudo chmod 666 /dev/kvm
          (sudo kata-runtime check --no-network-checks 2>&1 || true) | tail -5
          time docker pull -q node:22-bookworm
      - name: Start Warren
        run: |
          sudo WARREN_XFS_SIZE=60G WARREN_XFS_IMG=$( [ -d /mnt ] && echo /mnt/warren-xfs.img || echo /var/warren-xfs.img ) dev/setup-host.sh
          sudo install -D -m 0755 target/x86_64-unknown-linux-musl/release/warren-agent /usr/local/lib/warren/warren-agent
          sudo install -m 0755 target/release/warrend /usr/local/bin/warrend
          time sudo warrend build fair node:22-bookworm --vcpus 2 --mem-mib 4096
          sudo WARREN_NET_POOL=48 bash -c 'nohup warrend serve > /tmp/warrend.log 2>&1 &'
          for i in $(seq 100); do curl -fs localhost:7171/healthz && break; sleep 0.2; done
      - name: Run fairbench
        run: |
          sudo -E env "PATH=$PATH" node bench/fair/run.mjs \
            --systems "${{ inputs.systems || 'warren,docker,gvisor,kata' }}" \
            --rounds "${{ inputs.rounds || '15' }}" --heavy-rounds "${{ inputs.heavy_rounds || '5' }}" \
            --out /tmp/fairbench.json
      - name: Diagnostics
        if: always()
        run: |
          sudo grep -E "WARN|ERROR" /tmp/warrend.log | tail -20 || true
          sudo dmesg | grep -iE "oom|killed process" | tail -10 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fairbench
          path: /tmp/fairbench.*
          if-no-files-found: ignore
