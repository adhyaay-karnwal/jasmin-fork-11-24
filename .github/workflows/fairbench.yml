name: fairbench
# Same-host, interleaved, held-out benchmark: Jasmine vs Docker (runc), gVisor and Kata.
on:
  push:
    paths: ["bench/fair/**", ".github/workflows/fairbench.yml"]
  workflow_dispatch:
    inputs:
      rounds: { description: "interleaved rounds", default: "15" }
      heavy_rounds: { description: "rounds that include the heavy tasks", default: "5" }
      systems: { description: "systems", default: "jasmine,docker,gvisor,kata" }
      jasmine_ref: { description: "git ref of Jasmine to build (A/B runs)", default: "" }
      extra: { description: "extra run.mjs flags", default: "" }

jobs:
  fairbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host info
        run: nproc; free -h; grep -m1 'model name' /proc/cpuinfo; uname -r; ls -l /dev/kvm; df -h / /mnt
      - name: Build Jasmine
        run: |
          [ -n "${{ inputs.jasmine_ref }}" ] && git fetch -q origin "${{ inputs.jasmine_ref }}" && git checkout -q FETCH_HEAD -- crates
          rustup target add x86_64-unknown-linux-musl
          cargo build -q --release -p jasmine-agent --target x86_64-unknown-linux-musl
          cargo build -q --release -p jasmined
      - name: One shared disk for every system (native XFS on the runner's scratch SSD)
        run: |
          set -x
          sudo swapoff -a || true
          DEV=$(findmnt -n -o SOURCE --target /mnt --mountpoint /mnt || true)
          if [ -n "$DEV" ]; then
            # A real scratch partition: reformat it as native XFS.
            sudo umount /mnt && sudo mkfs.xfs -q -f -m reflink=1 "$DEV" && sudo mount -o noatime "$DEV" /mnt
          else
            # No scratch partition on this runner: one loop-backed XFS volume, shared by every system.
            sudo truncate -s 60G /var/fairbench-xfs.img && sudo mkfs.xfs -q -f -m reflink=1 /var/fairbench-xfs.img
            sudo mkdir -p /mnt && sudo mount -o loop,noatime /var/fairbench-xfs.img /mnt
          fi
          sudo mkdir -p /mnt/docker /mnt/jasmine /var/lib/jasmine
          sudo mount --bind /mnt/jasmine /var/lib/jasmine
          df -hT /mnt /var/lib/jasmine
      - name: Install gVisor and Kata as Docker runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          # gVisor from its official apt repository.
          ( curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list \
            && sudo apt-get -qq update && sudo apt-get -qq install -y runsc ) || echo "gvisor install failed"
          # Kata: 4.x ships the Go runtime (containerd-shim-kata-v2) as kata-go-static; take both and locate the shim.
          KV=$(gh api repos/kata-containers/kata-containers/releases/latest --jq .tag_name)
          for a in kata-static kata-go-static; do
            curl -fsSL "https://github.com/kata-containers/kata-containers/releases/download/${KV}/${a}-${KV}-amd64.tar.zst" -o /tmp/$a.tar.zst && sudo tar --zstd -xf /tmp/$a.tar.zst -C / || echo "kata asset $a failed"
          done
          SHIM=$(sudo find /opt/kata -name containerd-shim-kata-v2 -type f | head -1); echo "kata shim: $SHIM"
          [ -n "$SHIM" ] && sudo ln -sf "$SHIM" /usr/local/bin/containerd-shim-kata-v2
          echo '{"data-root":"/mnt/docker","runtimes":{"runsc":{"path":"/usr/bin/runsc","runtimeArgs":["--overlay2=none","--file-access=shared"]},"kata":{"runtimeType":"io.containerd.kata.v2"}}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
          sudo chmod 666 /dev/kvm
          time docker pull -q node:22-bookworm
      - name: Start Jasmine
        run: |
          sudo dev/setup-host.sh   # /var/lib/jasmine is already native XFS (bind of /mnt/jasmine)
          sudo install -D -m 0755 target/x86_64-unknown-linux-musl/release/jasmine-agent /usr/local/lib/jasmine/jasmine-agent
          sudo install -m 0755 target/release/jasmined /usr/local/bin/jasmined
          time sudo jasmined build fair node:22-bookworm --vcpus 2 --mem-mib 4096
          sudo JASMINE_NET_POOL=48 bash -c 'nohup jasmined serve > /tmp/jasmined.log 2>&1 &'
          for i in $(seq 100); do curl -fs localhost:7171/healthz && break; sleep 0.2; done
      - name: Run fairbench
        run: |
          sudo -E env "PATH=$PATH" node bench/fair/run.mjs \
            --systems "${{ inputs.systems || 'jasmine,docker,gvisor,kata' }}" \
            --rounds "${{ inputs.rounds || '15' }}" --heavy-rounds "${{ inputs.heavy_rounds || '5' }}" \
            --out /tmp/fairbench.json ${{ inputs.extra }}
      - name: Diagnostics
        if: always()
        run: |
          echo "Jasmine VMM start-up retries: $(sudo grep -c 'VMM died during start-up' /tmp/jasmined.log || true)" | tee /tmp/fairbench.retries.txt
          sudo grep -E "WARN|ERROR" /tmp/jasmined.log | grep -v "VMM died" | tail -20 || true
          sudo dmesg | grep -iE "oom|killed process" | tail -10 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fairbench
          path: /tmp/fairbench.*
          if-no-files-found: ignore
